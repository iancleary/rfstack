[release]
runner_protocol = "prepared-v1"
name = "rfstack"
version_source = "VERSION"
runner = [
  "uv", "run", "scripts/release.py", "version-file-release",
  "--provider", "github",
  "--version-file", "VERSION",
  "--tag-prefix", "v",
  "--branch", "main",
]
dry_run_args = ["--dry-run"]
current_version_command = [
  "uv", "run", "scripts/release.py", "version-file-current",
  "--version-file", "VERSION",
]
publish = true

[checks]
commands = [
  ["./scripts/check.sh"],
]

[runner_source]
repository = "https://github.com/iancleary/release-skills"
revision = "9132f4895385bc469b389a5c3686aa8cad69ab53"
sha256 = "fbda2341449e776e6c0b15f70492ddaed34614a43c4598acc408ab4026dc096f"
